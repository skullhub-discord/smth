<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>finny.obf</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f1117;
            color: #d4d8e0;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .app {
            width: 100%;
            max-width: 1200px;
            background: #1a1e26;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            border: 1px solid #2a2f3a;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #f0f4fa;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #8a92a0;
        }
        .panels {
            display: flex;
            gap: 16px;
            min-height: 400px;
            flex-wrap: wrap;
        }
        .panel {
            flex: 1;
            min-width: 280px;
            background: #0f1219;
            border-radius: 10px;
            border: 1px solid #282e3a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-header {
            padding: 8px 14px;
            background: #151b24;
            border-bottom: 1px solid #282e3a;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #8a92a0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-header .count {
            background: #282e3a;
            padding: 0 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #c8d0dc;
        }
        textarea {
            flex: 1;
            width: 100%;
            border: none;
            padding: 14px;
            background: transparent;
            color: #d4d8e0;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.7;
            resize: none;
            outline: none;
        }
        textarea::placeholder {
            color: #4a5260;
        }
        .output textarea {
            color: #a8d4b0;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            padding-top: 4px;
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            background: #2a3240;
            color: #c8d0dc;
            transition: background 0.2s, transform 0.1s;
            font-family: inherit;
        }
        .btn:hover { background: #3a4358; }
        .btn-primary {
            background: #2d6bb8;
            color: #fff;
        }
        .btn-primary:hover { background: #3a7fc8; }
        .btn-success {
            background: #2b8c5e;
            color: #fff;
        }
        .btn-success:hover { background: #36a070; }
        .btn-danger {
            background: #b84a4a;
            color: #fff;
        }
        .btn-danger:hover { background: #cc5a5a; }
        .status {
            font-size: 13px;
            color: #8a92a0;
            margin-left: auto;
            padding: 4px 12px;
            border-radius: 12px;
            background: #1a1e26;
        }
        .status.green { color: #6ecb8a; }
        .status.red { color: #d97a7a; }
        .status.blue { color: #6a9fd8; }
        .file-input {
            display: none;
        }
        .drag-over {
            border-color: #3a7fc8;
            box-shadow: 0 0 0 2px rgba(45, 107, 184, 0.3);
        }
        @media (max-width: 700px) {
            .panels { flex-direction: column; }
            .app { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>⚡ finny.obf <small>– Luau Anti‑Dump Obfuscator</small></h1>
        </div>

        <div class="panels">
            <div class="panel" id="inputPanel">
                <div class="panel-header">
                    <span>📄 Input</span>
                    <span class="count" id="inputCount">0 lines</span>
                </div>
                <textarea id="source" placeholder="Paste your Luau source here or drag &amp; drop a .lua file"></textarea>
            </div>
            <div class="panel output">
                <div class="panel-header">
                    <span>📦 Output</span>
                    <span class="count" id="outputCount">0 lines</span>
                </div>
                <textarea id="output" readonly placeholder="Obfuscated code will appear here"></textarea>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn btn-primary" id="obfBtn">▶ Obfuscate</button>
            <button class="btn" id="loadBtn">📂 Load</button>
            <input type="file" id="fileInput" class="file-input" accept=".lua,.txt" />
            <button class="btn btn-success" id="copyBtn">📋 Copy</button>
            <button class="btn" id="downloadBtn">⬇ Download</button>
            <button class="btn btn-danger" id="clearBtn">✕ Clear</button>
            <span class="status" id="statusText">Ready</span>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            const source = document.getElementById('source');
            const output = document.getElementById('output');
            const inputCount = document.getElementById('inputCount');
            const outputCount = document.getElementById('outputCount');
            const statusText = document.getElementById('statusText');
            const obfBtn = document.getElementById('obfBtn');
            const loadBtn = document.getElementById('loadBtn');
            const fileInput = document.getElementById('fileInput');
            const copyBtn = document.getElementById('copyBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const clearBtn = document.getElementById('clearBtn');
            const inputPanel = document.getElementById('inputPanel');

            function updateCounts() {
                inputCount.textContent = source.value.split('\n').length + ' lines';
                outputCount.textContent = output.value.split('\n').length + ' lines';
            }
            source.addEventListener('input', updateCounts);
            output.addEventListener('input', updateCounts);

            function setStatus(text, state = '') {
                statusText.textContent = text;
                statusText.className = 'status ' + state;
            }

            // ─── Obfuscation Logic (Universal Anti‑Dump) ───
            function obfuscate(plainCode) {
                const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
                const randHex = (len) => {
                    let s = '';
                    for (let i = 0; i < len; i++) s += '0123456789abcdef'[rand(0, 15)];
                    return s;
                };

                const varEnv = `_0x${randHex(4)}`;
                const varRealData = `_0x${randHex(4)}`;
                const varDecoyData = `_0x${randHex(4)}`;
                const varLoader = `_0x${randHex(4)}`;
                const varTamper = `_0x${randHex(4)}`;
                const varActive = `_0x${randHex(4)}`;
                const varKey = `_0x${randHex(4)}`;
                const varChars = `_0x${randHex(4)}`;
                const varDecrypt = `_0x${randHex(4)}`;
                const varPayload = `_0x${randHex(4)}`;
                const varExec = `_0x${randHex(4)}`;
                const varTrace = `_0x${randHex(4)}`;

                const realBytes = new TextEncoder().encode(plainCode);
                const realKey = rand(40, 85);
                const realList = [];
                for (let i = 0; i < realBytes.length; i++) {
                    realList.push(realBytes[i] ^ (realKey + (i % 7)));
                }

                const decoySource = `print("this gng really thought he could get my code! what a skid. ")`;
                const decoyBytes = new TextEncoder().encode(decoySource);
                const decoyKey = rand(40, 85);
                const decoyList = [];
                for (let i = 0; i < decoyBytes.length; i++) {
                    decoyList.push(decoyBytes[i] ^ (decoyKey + (i % 7)));
                }

                const parts = [];

                parts.push(`local ${varEnv} = { [(4)] = game, [(9)] = workspace };`);
                parts.push(`local ${varRealData} = {${realList.join(',')}};`);
                parts.push(`local ${varDecoyData} = {${decoyList.join(',')}};`);

                parts.push(`local _p1 = 'load'; local _p2 = 'str'; local _p3 = 'ing';`);
                parts.push(`local ${varLoader} = getfenv()[_p1 .. _p2 .. _p3];`);

                parts.push(`local ${varTamper} = false;`);
                parts.push(`local ${varTrace} = debug.info and debug.info(1, 's') or '';`);
                parts.push(`if ${varTrace} == '=(string)' or string.find(${varTrace}, 'dump') or string.find(${varTrace}, 'chunk') then`);
                parts.push(`  ${varTamper} = true;`);
                parts.push(`end;`);
                parts.push(`if debug.info and debug.info(${varLoader}, 's') ~= '[C]' then`);
                parts.push(`  ${varTamper} = true;`);
                parts.push(`end;`);
                parts.push(`if getfenv() == nil or getmetatable(getfenv()) ~= nil then`);
                parts.push(`  ${varTamper} = true;`);
                parts.push(`end;`);

                parts.push(`local ${varActive} = ${varRealData};`);
                parts.push(`local ${varKey} = ${realKey};`);
                parts.push(`if ${varTamper} then`);
                parts.push(`  ${varActive} = ${varDecoyData};`);
                parts.push(`  ${varKey} = ${decoyKey};`);
                parts.push(`end;`);

                parts.push(`local ${varChars} = {};`);
                parts.push(`for i = 1, #${varActive} do`);
                parts.push(`  local ${varDecrypt} = bit32.bxor(${varActive}[i], ${varKey} + ((i - 1) % 7));`);
                parts.push(`  ${varChars}[i] = string.char(${varDecrypt});`);
                parts.push(`end;`);

                parts.push(`local ${varPayload} = table.concat(${varChars});`);
                parts.push(`local ${varExec} = ${varLoader}(${varPayload});`);
                parts.push(`${varExec}();`);

                return parts.join('\n');
            }

            // ─── UI Actions ────────────────────────────────────────────

            obfBtn.addEventListener('click', function() {
                const input = source.value;
                if (!input.trim()) {
                    setStatus('⚠️ Paste some code first', 'red');
                    return;
                }
                try {
                    const start = performance.now();
                    const result = obfuscate(input);
                    output.value = result;
                    updateCounts();
                    const elapsed = (performance.now() - start).toFixed(0);
                    setStatus(`✅ Obfuscated in ${elapsed}ms`, 'green');
                } catch (e) {
                    setStatus('❌ Error: ' + e.message, 'red');
                    console.error(e);
                }
            });

            loadBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', function() {
                const file = this.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    source.value = e.target.result;
                    updateCounts();
                    setStatus(`📂 Loaded ${file.name} (${file.size} bytes)`, 'blue');
                };
                reader.onerror = function() { setStatus('❌ Read error', 'red'); };
                reader.readAsText(file);
                this.value = '';
            });

            let dragCounter = 0;
            inputPanel.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.stopPropagation();
                this.classList.add('drag-over');
            });
            inputPanel.addEventListener('dragleave', function(e) {
                e.preventDefault();
                e.stopPropagation();
                dragCounter--;
                if (dragCounter <= 0) {
                    this.classList.remove('drag-over');
                    dragCounter = 0;
                }
            });
            inputPanel.addEventListener('drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                this.classList.remove('drag-over');
                dragCounter = 0;
                const files = e.dataTransfer.files;
                if (files.length && (files[0].name.endsWith('.lua') || files[0].name.endsWith('.txt'))) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        source.value = ev.target.result;
                        updateCounts();
                        setStatus(`📂 Dropped ${files[0].name} (${files[0].size} bytes)`, 'blue');
                    };
                    reader.onerror = function() { setStatus('❌ Read error', 'red'); };
                    reader.readAsText(files[0]);
                }
            });
            document.addEventListener('dragover', e => e.preventDefault());
            document.addEventListener('drop', e => e.preventDefault());

            copyBtn.addEventListener('click', function() {
                const text = output.value;
                if (!text) { setStatus('⚠️ Nothing to copy', 'red'); return; }
                navigator.clipboard?.writeText(text).then(() => {
                    setStatus('📋 Copied', 'green');
                }).catch(() => {
                    output.select();
                    document.execCommand('copy');
                    setStatus('📋 Copied (fallback)', 'green');
                });
            });

            downloadBtn.addEventListener('click', function() {
                const text = output.value;
                if (!text) { setStatus('⚠️ Nothing to download', 'red'); return; }
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'finny_output.lua';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                setStatus('⬇️ Downloaded', 'green');
            });

            clearBtn.addEventListener('click', function() {
                source.value = '';
                output.value = '';
                updateCounts();
                setStatus('🗑️ Cleared', '');
            });

            source.value = '-- Paste your Luau code here\nprint("Hello, world!")';
            updateCounts();
            setStatus('Ready');
        })();
    </script>
</body>
</html>
